    <style>
      :root {
  --primary: #d54d4d;
  --primary-hover: #b93d3d;
  --primary-focus: #d54d4d33;
  --primary-inverse: #fff;
  --background-color: #f8fafb; /* light terminal bg */
  --muted-border-color: #d6b97b;
  --color: #222; /* dark text for contrast */
  --h1-color: #d54d4d;
  --h2-color: #d54d4d;
  --h3-color: #d54d4d;
  --h4-color: #d54d4d;
  --h5-color: #d54d4d;
  --h6-color: #d54d4d;
  --terminal-header-bg: #eaeaea;
  --terminal-border: #bfa76a;
  --terminal-shadow: 0 2px 16px 0 rgba(0,0,0,0.04);
  --terminal-font: 'Fira Mono', 'Consolas', 'Menlo', 'Monaco', monospace;
}
body {
  background-color: var(--background-color) !important;
  color: var(--color) !important;
  font-family: var(--terminal-font);
}
header {
  background: var(--terminal-header-bg) !important;
  border-bottom: 2px solid var(--terminal-border);
  font-family: var(--terminal-font);
  box-shadow: var(--terminal-shadow);
}
.layout {
  display: flex;
  justify-content: center;
  margin-top: 2rem;
}
main {
  background: #fff;
  border: 2px solid var(--terminal-border);
  border-radius: 8px;
  box-shadow: var(--terminal-shadow);
  padding: 2rem;
  max-width: 900px;
  width: 100%;
  font-family: var(--terminal-font);
}
aside {
  display: none; /* Hide sidebar for terminal look */
}
h1, h2, h3, h4, h5, h6 {
  color: var(--h1-color) !important;
  font-family: var(--terminal-font);
}
a, a:visited {
  color: var(--primary);
  text-decoration: underline dotted;
}
a:hover, a:focus {
  color: var(--primary-hover);
}
.corner-img {
  display: none; /* Hide image for terminal look */
}
p, .primary {
  color: var(--color) !important;
  line-height: 1.6;
}
@media (max-width: 768px) {
  .layout {
    margin-top: 1rem;
    padding: 0;
  }
  main {
    padding: 1rem;
  }
}
    </style>
